name: Guest TypeScript validation
on:
  pull_request:
  push:
    branches: [guest-filters-validated]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73b4b2c4c7d7b1b5c5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
